<svg width="1100" height="250" viewBox="0 0 1100 250" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <rect width="1100" height="250" fill="#0d1117"/>

  <!-- ===== Left side: identity ===== -->
  <text x="40" y="66" font-size="30" font-weight="700" letter-spacing="2" fill="#e6edf3">JOÃO ALMEIDA</text>

  <g fill="#8b949e" font-size="14">
    <text x="40" y="96" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.8s" fill="freeze"/>Systems Administration</text>
    <text x="40" y="116" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.8s" fill="freeze"/>Network Infrastructure</text>
    <text x="40" y="136" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.8s" fill="freeze"/>Cybersecurity</text>
    <text x="40" y="156" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.8s" fill="freeze"/>IT Infrastructure</text>
  </g>

  <!-- abstract network / server nodes -->
  <g stroke="#30363d" stroke-width="1" fill="none">
    <line x1="60" y1="200" x2="140" y2="225"/>
    <line x1="140" y1="225" x2="220" y2="195"/>
    <line x1="220" y1="195" x2="300" y2="230"/>
    <line x1="300" y1="230" x2="380" y2="205"/>
    <line x1="380" y1="205" x2="450" y2="225"/>
    <line x1="220" y1="195" x2="380" y2="205"/>
  </g>

  <g fill="#484f58">
    <circle cx="60" cy="200" r="3"/>
    <circle cx="140" cy="225" r="3"/>
    <circle cx="300" cy="230" r="3"/>
    <circle cx="450" cy="225" r="3"/>
  </g>

  <!-- server nodes (slightly larger, subtle pulse) -->
  <circle cx="220" cy="195" r="5" fill="#3fb950">
    <animate attributeName="r" values="5;6;5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="205" r="5" fill="#3fb950">
    <animate attributeName="r" values="5;6;5" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- traveling packets -->
  <circle r="2.4" fill="#58a6ff">
    <animateMotion path="M60,200 L140,225 L220,195" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.4" fill="#58a6ff">
    <animateMotion path="M300,230 L380,205 L450,225" dur="7s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== Right side: terminal ===== -->
  <rect x="580" y="20" width="480" height="210" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="600" cy="38" r="5" fill="#ff5f56"/>
  <circle cx="618" cy="38" r="5" fill="#ffbd2e"/>
  <circle cx="636" cy="38" r="5" fill="#27c93f"/>
  <text x="656" y="42" font-size="11" fill="#6e7681">bash — infrastructure</text>
  <line x1="580" y1="54" x2="1060" y2="54" stroke="#30363d" stroke-width="1"/>

  <g font-size="13" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.6s" fill="freeze"/>
    <text x="600" y="76"><tspan fill="#58a6ff">&gt;</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
  </g>
  <g font-size="13" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.6s" fill="freeze"/>
    <text x="606" y="94" fill="#e6edf3">João Almeida</text>
  </g>

  <g font-size="13" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.6s" fill="freeze"/>
    <text x="600" y="118"><tspan fill="#58a6ff">&gt;</tspan><tspan fill="#c9d1d9"> focus</tspan></text>
  </g>
  <g font-size="13" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.6s" fill="freeze"/>
    <text x="606" y="136" fill="#e6edf3">Systems / Networks / Security</text>
  </g>

  <g font-size="13" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.6s" fill="freeze"/>
    <text x="600" y="160"><tspan fill="#58a6ff">&gt;</tspan><tspan fill="#c9d1d9"> infrastructure.status</tspan></text>
  </g>

  <g font-size="13" font-family="'JetBrains Mono',Consolas,monospace" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.6s" fill="freeze"/>
    <circle cx="609" cy="176" r="3" fill="#3fb950"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <text x="620" y="180" fill="#c9d1d9">systems      <tspan fill="#3fb950">ONLINE</tspan></text>

    <circle cx="609" cy="194" r="3" fill="#3fb950"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="620" y="198" fill="#c9d1d9">network      <tspan fill="#3fb950">REACHABLE</tspan></text>

    <circle cx="609" cy="212" r="3" fill="#3fb950"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <text x="620" y="216" fill="#c9d1d9">monitoring   <tspan fill="#3fb950">ACTIVE</tspan></text>
  </g>

  <!-- blinking cursor -->
  <rect x="762" y="204" width="7" height="13" fill="#58a6ff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" begin="3.8s" repeatCount="indefinite"/>
  </rect>
</svg>
